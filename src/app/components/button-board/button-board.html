<div class="button-board">
  <!-- Hold Buttons Row -->
  <div class="hold-row">
    <button type="button" class="hold-btn" aria-label="Hold card 1" [attr.aria-pressed]="gameService.heldIndices()[0]" (click)="gameService.toggleHold(0)"></button>
    <span class="hc-label" aria-hidden="true">-H/C-</span>
    <button type="button" class="hold-btn" aria-label="Hold card 2" [attr.aria-pressed]="gameService.heldIndices()[1]" (click)="gameService.toggleHold(1)"></button>
    <span class="hc-label" aria-hidden="true">-H/C-</span>
    <button type="button" class="hold-btn" aria-label="Hold card 3" [attr.aria-pressed]="gameService.heldIndices()[2]" (click)="gameService.toggleHold(2)"></button>
    <span class="hc-label" aria-hidden="true">-H/C-</span>
    <button type="button" class="hold-btn" aria-label="Hold card 4" [attr.aria-pressed]="gameService.heldIndices()[3]" (click)="gameService.toggleHold(3)"></button>
    <span class="hc-label" aria-hidden="true">-H/C-</span>
    <button type="button" class="hold-btn" aria-label="Hold card 5" [attr.aria-pressed]="gameService.heldIndices()[4]" (click)="gameService.toggleHold(4)"></button>
  </div>

  <!-- Bottom Control Buttons -->
  <div class="controls-row">
    <!-- NEW GAME -->
    <div class="control-group horizontal">
      <button type="button" aria-label="New Game" (click)="gameService.newGame()" class="small-round-btn"></button>
      <span class="btn-label">New Game</span>
    </div>

    <!-- DEAL DRAW -->
    <div class="control-group deal-group horizontal">
      <div class="btn-well">
        <button type="button" [attr.aria-label]="gameService.isCountingScore() ? 'Skip score count' : (gameService.session()?.phase === 'dealt' ? 'Draw' : 'Deal')" (click)="onDealDraw()" class="deal-draw-btn"></button>
      </div>
      <span class="btn-label large">Deal/Draw</span>
    </div>

    <!-- SOUND & PLAYER -->
    <div class="control-group-row">
      <div class="control-group">
        <button type="button" aria-label="Toggle Sound" [attr.aria-pressed]="gameService.soundEnabled()" (click)="gameService.toggleSound()" class="small-round-btn"></button>
        <span class="btn-label">Sound</span>
      </div>
      <div class="control-group">
        <button type="button" aria-label="Switch Player" (click)="gameService.switchPlayer()" class="small-round-btn"></button>
        <span class="btn-label">Player</span>
      </div>
    </div>
  </div>
</div>
